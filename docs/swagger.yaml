openapi: 3.0.0
info:
  title: Feature Sales Management CRUD API's
  version: "1.0.0"
  description: REST API documentation for Keysar Cosmetics.

servers:
  - url: "https://keysarcosmetics.fly.dev"
    description: Production Server

tags:
  - name: Sales
    description: Operations related to sales by branch.
  - name: Employees
    description: Operations related to employee management.
  - name: Branch
    description: Operations related to branches.
  - name: Payment Methods
    description: Operations related to payment methods.
  - name: Auth
    description: Authentication endpoints.
  - name: Reports
    description: Operations related to sales and business reports.
  - name: Dashboard
    description: Endpoints for dashboard analytics and charts.

paths:
  /keysarCosmetics/sales/branch:
    get:
      summary: Get all sales by branch
      description: Returns an array with all sales registered by branch, including branch name and details.
      tags: [Sales]
      responses:
        "200":
          description: List of sales by branch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesBranch"
              example:
                - idSalesBranch: 1
                  idBranch: 3
                  branchName: "DELTA"
                  dateSalesBranch: "2025-07-03"
                  salesBranchTotal: 72000.00
                  notes: ""
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/employees:
    get:
      summary: Get all employees
      description: Returns an array of all registered employees.
      tags: [Employees]
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
              example:
                - idEmployee: 1
                  fullName: "JUANA PEREZ MAR"
                  firstName: "JUANA"
                  lastName: "PEREZ"
                  middleName: "MAR"
                  bank: "BBVA"
                  accountNumber: "0123456789"
                  position: "Vendedor"
                  personalTarget: 120000.00
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      summary: Create a new employee
      description: Registers a new employee.
      tags: [Employees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreateRequest"
            example:
              fullName: "JUANA PEREZ MAR"
              firstName: "JUANA"
              lastName: "PEREZ"
              middleName: "MAR"
              bank: "BBVA"
              accountNumber: "0123456789"
              position: "Vendedor"
              personalTarget: 120000
      responses:
        "201":
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/employees/{id}:
    put:
      summary: Update an employee
      description: Updates an existing employee by ID.
      tags: [Employees]
      parameters:
        - in: path
          name: id
          required: true
          description: Employee ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdateRequest"
      responses:
        "200":
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      summary: Delete an employee
      description: Deletes an employee by ID.
      tags: [Employees]
      parameters:
        - in: path
          name: id
          required: true
          description: Employee ID
          schema:
            type: integer
      responses:
        "200":
          description: Employee deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnly"
              example:
                message: "Employee deleted successfully"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/branches:
    get:
      summary: Get all branches
      description: Returns an array of all branches.
      tags: [Branch]
      responses:
        "200":
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
              example:
                - idBranch: 4
                  branchName: "GALERIAS INSURGENTES"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      summary: Create a new branch
      description: Registers a new branch.
      tags: [Branch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchCreateRequest"
            example:
              branchName: "NEW BRANCH"
      responses:
        "201":
          description: Branch created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/branches/{id}:
    put:
      summary: Update a branch
      description: Updates an existing branch by ID.
      tags: [Branch]
      parameters:
        - in: path
          name: id
          required: true
          description: Branch ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdateRequest"
      responses:
        "200":
          description: Branch updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "404":
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      summary: Delete a branch
      description: Deletes a branch by ID.
      tags: [Branch]
      parameters:
        - in: path
          name: id
          required: true
          description: Branch ID
          schema:
            type: integer
      responses:
        "200":
          description: Branch deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnly"
              example:
                message: "Branch deleted successfully"
        "404":
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/payment-methods:
    get:
      summary: Get all payment methods
      description: Returns an array of all payment methods.
      tags: [Payment Methods]
      responses:
        "200":
          description: List of payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
              example:
                - idPaymentMethod: 1
                  paymentMethodName: "Cash"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      summary: Create a new payment method
      description: Registers a new payment method.
      tags: [Payment Methods]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodCreateRequest"
            example:
              paymentMethodName: "NEW METHOD"
      responses:
        "201":
          description: Payment method created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/payment-methods/{id}:
    put:
      summary: Update a payment method
      description: Updates an existing payment method by ID.
      tags: [Payment Methods]
      parameters:
        - in: path
          name: id
          required: true
          description: Payment Method ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodUpdateRequest"
      responses:
        "200":
          description: Payment method updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "404":
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      summary: Delete a payment method
      description: Deletes a payment method by ID.
      tags: [Payment Methods]
      parameters:
        - in: path
          name: id
          required: true
          description: Payment Method ID
          schema:
            type: integer
      responses:
        "200":
          description: Payment method deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnly"
              example:
                message: "Payment method deleted successfully"
        "404":
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/login:
    post:
      summary: User login
      description: Authenticates a user and sets a JWT token as an HttpOnly cookie. Responds only with a message.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Employee email address.
                  example: user@example.com
                password:
                  type: string
                  format: password
                  description: Employee password.
                  example: "supersecret"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnly"
              example:
                message: "Login successful"
        "400":
          description: Email or password not provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Email and password are required"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Invalid credentials"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Internal server error"

  /keysarCosmetics/logout:
    post:
      summary: User logout
      description: Logs out the user by clearing the JWT token cookie.
      tags: [Auth]
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnly"
              example:
                message: "Logout successful"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/verify-token:
    get:
      summary: Verify JWT token
      description: Verifies the user's JWT token from cookies.
      tags: [Auth]
      responses:
        "200":
          description: Token is valid and user is authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    description: Whether the user is authenticated.
                    example: true
                  user:
                    type: object
                    description: Decoded user information from the token.
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: "ENRIQUE RAMIREZ"
                      position:
                        type: string
                        example: "ADMIN"
        "401":
          description: Invalid or missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: false
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  # --------------------
  # REPORT ENDPOINTS - Reports tag only!
  # --------------------
  /keysarCosmetics/reports/branches:
    get:
      summary: Get sales report by branch
      description: |
        Returns an array with the total sales registered by branch, grouped by date, within a given date range.
      tags: [Reports]
      parameters:
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
          description: Start date of the range (YYYY-MM-DD)
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
          description: End date of the range (YYYY-MM-DD)
      responses:
        "200":
          description: List of sales grouped by branch and date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchReportRow"
              example:
                - DATE: "2025-08-01"
                  DELTA: 10000
                  ROMA: 5000
                  TOTAL: 15000
        "400":
          description: Missing required dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Both startDate and endDate are required."
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/reports/employees:
    get:
      summary: Get sales report by employee
      description: |
        Returns a report with total sales per employee and branch, the monthly target, total sales, amount remaining to reach the target, and achieved percentage, within a given date range.
      tags: [Reports]
      parameters:
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
          description: Start date of the range (YYYY-MM-DD)
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
          description: End date of the range (YYYY-MM-DD)
      responses:
        "200":
          description: List of sales grouped by employee and branch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeReportRow"
              example:
                - EMPLOYEE: "JUANA PEREZ"
                  DELTA: 10000
                  ROMA: 20000
                  TOTAL: 30000
                  MONTHLY_TARGET: 40000
                  TO_GO: 10000
                  PERCENTAGE: 75
        "400":
          description: Missing required dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Both startDate and endDate are required."
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/reports/payment-methods:
    get:
      summary: Get sales report by payment method
      description: |
        Returns a report of sales grouped by branch and payment method, including overall totals, within a given date range.
      tags: [Reports]
      parameters:
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
          description: Start date of the range (YYYY-MM-DD)
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
          description: End date of the range (YYYY-MM-DD)
      responses:
        "200":
          description: List of sales grouped by payment method and branch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethodReportRow"
              example:
                - branch: "DELTA"
                  CASH: 12000
                  CARD: 3000
                  TOTAL: 15000
                - branch: "OVERALL TOTAL"
                  CASH: 32000
                  CARD: 7000
                  TOTAL: 39000
        "400":
          description: Missing required dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: "Both startDate and endDate are required."
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/dashboard/sales/branch:
    get:
      summary: Get sales by branch (day, month, or year)
      tags: [Dashboard]
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
          description: Date filter (YYYY-MM-DD for day, YYYY-MM for month, YYYY for year)
      responses:
        "200":
          description: List of sales per branch
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    branch:
                      type: string
                    sales:
                      type: number
        "400":
          description: Invalid or missing date parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/dashboard/sales/branch/total:
    get:
      summary: Get total sales (day, month, or year)
      tags: [Dashboard]
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
          description: Date filter (YYYY-MM-DD for day, YYYY-MM for month, YYYY for year)
      responses:
        "200":
          description: Total sales for the period
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
        "400":
          description: Invalid or missing date parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/dashboard/sales/employee/chart:
    get:
      summary: Get top sellers by sales (for chart)
      tags: [Dashboard]
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: Month in format YYYY-MM (e.g., 2025-07)
      responses:
        "200":
          description: List of top sellers for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    employee:
                      type: string
                    position:
                      type: string
                    sales:
                      type: number
        "400":
          description: Missing or invalid month parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /keysarCosmetics/dashboard/sales/branch/chart:
    get:
      summary: Get monthly sales per branch (for chart)
      tags: [Dashboard]
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: Month in format YYYY-MM (e.g., 2025-07)
      responses:
        "200":
          description: List of monthly totals per branch
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    branch:
                      type: string
                    total:
                      type: number
        "400":
          description: Missing or invalid month parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
